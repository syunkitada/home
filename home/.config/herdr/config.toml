onboarding = false
[keys]
prefix = "ctrl+b"

# Pane layout and navigation (matching tmux.conf)
split_horizontal = "prefix+s"
split_vertical = "prefix+v"
close_pane = "prefix+q"
zoom = "prefix+z"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

# Tabs (tmux windows)
new_tab = "prefix+space"
close_tab = "prefix+shift+q"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"

# Session operations
detach = "prefix+d"
workspace_picker = "prefix+w"
reload_config = "prefix+r"
