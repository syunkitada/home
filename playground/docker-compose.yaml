version: "3"
services:
  centos7:
    hostname: home-centos7
    container_name: home-centos7
    build:
      context: docker_images/centos7
    user: "1000:1000"
    working_dir: "/home/playground/home"
    volumes:
      - "${HOME}/home:/home/playground/home:ro"
    network_mode: "host"
    entrypoint: bash -c "sleep 36000"

  rocky9:
    hostname: home-rocky9
    container_name: home-rocky9
    build:
      context: docker_images/rocky9
    user: "1000:1000"
    working_dir: "/home/playground"
    volumes:
      - "${HOME}/home:/home/playground/home:ro"
    network_mode: "host"
    entrypoint: bash -c "sleep 36000"

  ubuntu24:
    hostname: home-ubuntu24
    container_name: home-ubuntu24
    build:
      context: docker_images/ubuntu24
    user: "1000:1000"
    working_dir: "/home/playground"
    volumes:
      - "${HOME}/home:/home/playground/home:ro"
    network_mode: "host"
    entrypoint: bash -c "sleep 36000"

networks:
  localnet:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.100.11.0/24
